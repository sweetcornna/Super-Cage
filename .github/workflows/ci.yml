name: CI
# The gate for pull requests and main: Linux runners only, no installers. The
# platform builds (macOS, Windows, Linux package) are in full-tests.yml and run
# by hand.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  scripts:
    name: Repository and script checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # esigner.test.mjs compiles and runs a Java signer stub.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Repository files and version consistency
        run: |
          node scripts/check-repository-files.mjs
          node scripts/check-version.mjs
      - name: Script tests
        run: node --test scripts/release-version.test.mjs scripts/release/release-tool.test.mjs scripts/esigner.test.mjs scripts/fetch-build-artifact.test.mjs scripts/windows-native-bridge.test.mjs
      - name: Guest creation preference contracts
        run: |
          node scripts/guest-os/tests/browser-profile.test.mjs
          node internal/cage/device-observation.test.mjs
          node internal/cage/browser-audit.test.mjs
      - name: Windows signing script test
        run: pwsh -NoProfile -File scripts/test-windows-signing.ps1

  workflows:
    name: Workflow syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.11 -color

  ui:
    name: Workbench and portal
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --prefix ui --no-audit --no-fund
      - run: npm run --prefix ui lint
      - run: npm test --prefix ui
      # The portal's own logic tests; browser.test.mjs needs Chrome and stays out.
      - run: node --test ui/tenant/app.test.mjs ui/tenant/mock-integration.test.mjs

  go-build:
    name: Go build and vet (Linux, Windows)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/tailnet/go.sum
      # ui/scripts/prepare-vnc.mjs patches noVNC with "uv run python".
      - uses: astral-sh/setup-uv@v10.3.3
      # The workbench UI and the guest payloads are embedded in the binary.
      - name: Build cage and cage-attach for Linux
        run: make cage
      - name: Vet for Linux
        run: make check-linux
      - name: Vet for Windows (amd64 and arm64)
        run: make check-windows

  go-test:
    name: Go tests
    # The runner image the same packages passed on before (see Makefile test-fast).
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/tailnet/go.sum
      # ui/scripts/prepare-vnc.mjs patches noVNC with "uv run python".
      - uses: astral-sh/setup-uv@v10.3.3
      - run: make cage-ui assets tailnet-assets
      - run: make test-fast

  tailnet:
    name: Tailnet guest payload tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: tools/tailnet/go.sum
      - run: go test ./...
        working-directory: tools/tailnet
        env:
          GOFLAGS: ''

  # One stable name to require in branch protection.
  result:
    name: Main PR CI
    needs: [scripts, workflows, ui, go-build, go-test, tailnet]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            [[ "$result" == success ]] || exit 1
          done
