name: Reusable Windows build and installer
on:
  workflow_call:
    inputs:
      ref:
        description: Exact 40-character commit SHA to build
        required: true
        type: string
      artifact_name:
        description: Development artifact prefix
        required: true
        type: string
permissions:
  contents: read
jobs:
  development:
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/windows-toolchain
        with:
          # Rehearse the release-only source collection on every build, so
          # it cannot first fail while a release is waiting.
          corresponding-sources: true
      - name: Build, test and install the unsigned development package
        env:
          CAGE_BUILD_REF: ${{ inputs.ref }}
        run: ./scripts/ci-windows-build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: _output/releases/*/windows/*
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - name: Preserve failed unsigned candidates for installation debugging
        if: ${{ always() && job.status != 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}-failed-candidate
          path: |
            _output/windows-amd64/app/**
            _output/releases/*/windows/Super-Cage-*-windows-amd64-setup-unsigned.exe
            _output/releases/*/windows/SHA256SUMS
          if-no-files-found: ignore
          compression-level: 0
          overwrite: true
          retention-days: 14
      - name: Preserve public test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}-reports
          path: |
            ${{ runner.temp }}/cage-smoke-*.json
            ${{ runner.temp }}/cage-build-ui-*/smoke.json
            ${{ runner.temp }}/cage-build-ui-*/*.png
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14
