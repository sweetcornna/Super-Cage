name: Reusable Windows build and installer
on:
  workflow_call:
    inputs:
      ref:
        description: Exact 40-character commit SHA to build
        required: true
        type: string
      release:
        description: Keep false. No release job remains here; true skips the development build and builds nothing
        type: boolean
        default: false
      artifact_name:
        description: Release artifact name, or development artifact prefix
        required: true
        type: string
      all_windows_versions:
        description: Also test the development package on Windows Server 2022
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  development:
    if: ${{ !inputs.release }}
    strategy:
      fail-fast: false
      matrix:
        # windows-2025 produces the test package. The older image repeats
        # the same suite, so ordinary branch pushes leave it out.
        os: ${{ fromJSON(inputs.all_windows_versions && '["windows-2025", "windows-2022"]' || '["windows-2025"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/windows-toolchain
        with:
          # Rehearse the release-only source collection on every change, so
          # it cannot first fail while a release is waiting.
          corresponding-sources: ${{ matrix.os == 'windows-2025' }}
      - name: Build, test and install the unsigned development package
        env:
          CAGE_BUILD_REF: ${{ inputs.ref }}
        run: ./scripts/ci-windows-build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}-${{ matrix.os }}
          path: _output/releases/*/windows/*
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - name: Preserve failed unsigned candidates for installation debugging
        if: ${{ always() && job.status != 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}-${{ matrix.os }}-failed-candidate
          path: |
            _output/windows-amd64/app/**
            _output/releases/*/windows/Super-Cage-*-windows-amd64-setup-unsigned.exe
            _output/releases/*/windows/SHA256SUMS
          if-no-files-found: ignore
          compression-level: 0
          overwrite: true
          retention-days: 14
      - name: Preserve public test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}-${{ matrix.os }}-reports
          path: |
            ${{ runner.temp }}/cage-smoke-*.json
            ${{ runner.temp }}/cage-build-ui-*/smoke.json
            ${{ runner.temp }}/cage-build-ui-*/*.png
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14